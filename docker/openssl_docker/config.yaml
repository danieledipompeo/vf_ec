energy:
  iterations: 5
  timeout_ms: 1000
  cool_down_sec: 1.0
  target_duration_sec: 2.0
  rapl:
    events:
      - "power/energy-pkg/"
    additional_counters:
      - "cycles"
      - "instructions"
  perf:
    binary: "perf"
    options:
      all_cpus: true
      delimiter: ","
